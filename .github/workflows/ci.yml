name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --locked

      - name: Run integration tests (interpreter)
        run: cargo test --test run

      - name: Cache generated Rust projects
        uses: actions/cache@v5
        with:
          path: target/transpile-cases
          key: ${{ runner.os }}-transpile-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-transpile-

      # IMPORTANT: --test-threads=1 is mandatory here, not a style choice -- see the
      # header comment in tests/transpile.rs. Every generated project's inner `cargo
      # run`/`cargo build` is pointed at one shared CARGO_TARGET_DIR
      # (target/transpile-cases) to avoid duplicating tokio/serde's build output ~400+
      # times over. Running this suite with the default multi-threaded runner races
      # concurrent `cargo run` invocations against that shared dir (observed: one
      # test's stdout came back containing a different test's output) and can degrade
      # into a multi-hour+ stall from piled-up build-lock contention.
      - name: Run integration tests (transpiler)
        run: cargo test --test transpile -- --test-threads=1

  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install clippy
        run: rustup component add clippy || (sleep 60 && rustup component add clippy) || (sleep 120 && rustup component add clippy)

      - name: Clippy
        run: cargo clippy -- -D warnings
