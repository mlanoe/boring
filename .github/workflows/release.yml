name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: boring-linux-x86_64
            binary: boring
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: boring-macos-x86_64
            binary: boring
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: boring-macos-arm64
            binary: boring
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: boring-windows-x86_64.exe
            binary: boring.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Boring ${{ github.ref_name }}
          body: |
            ## Install

            Download the binary for your platform, make it executable, and move it to your PATH:

            ```sh
            # macOS (Apple Silicon)
            curl -L https://github.com/mlanoe/boring/releases/download/${{ github.ref_name }}/boring-macos-arm64 -o boring
            chmod +x boring && mv boring /usr/local/bin/

            # macOS (Intel)
            curl -L https://github.com/mlanoe/boring/releases/download/${{ github.ref_name }}/boring-macos-x86_64 -o boring
            chmod +x boring && mv boring /usr/local/bin/

            # Linux (x86_64)
            curl -L https://github.com/mlanoe/boring/releases/download/${{ github.ref_name }}/boring-linux-x86_64 -o boring
            chmod +x boring && mv boring /usr/local/bin/

            # Windows (x86_64) — PowerShell
            Invoke-WebRequest https://github.com/mlanoe/boring/releases/download/${{ github.ref_name }}/boring-windows-x86_64.exe -OutFile boring.exe
            ```

            Or build from source with Rust installed:

            ```sh
            cargo install --git https://github.com/mlanoe/boring
            ```

            ## Changelog

            See [CHANGELOG.md](https://github.com/mlanoe/boring/blob/main/CHANGELOG.md) for details.
          files: |
            artifacts/boring-linux-x86_64/boring-linux-x86_64
            artifacts/boring-macos-x86_64/boring-macos-x86_64
            artifacts/boring-macos-arm64/boring-macos-arm64
            artifacts/boring-windows-x86_64.exe/boring-windows-x86_64.exe
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
