[package]
name        = "boring"
version     = "0.9.5"
edition     = "2021"
description = "A language that compiles to Rust — clean syntax, zero-cost abstractions, no boilerplate"
license     = "GPL-3.0"
repository  = "https://github.com/mlanoe/boring"
homepage    = "https://github.com/mlanoe/boring"
readme      = "README.md"
keywords    = ["language", "compiler", "transpiler", "rust", "boring"]
categories  = ["compilers", "command-line-utilities"]

[[bin]]
name = "boring"
path = "src/main.rs"

[dependencies]
thiserror = "1"
rayon = "1"
# Used only by the interpreter's `fromJson<T>()` builtin: `serde_json::Value` is the
# generic JSON tree the type-directed materializer in `src/interpreter/json.rs` walks.
# The *transpiler* never needs this crate — it emits `serde`/`serde_json` into the
# generated project's own Cargo.toml instead.
serde_json = "1"

